server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: let React Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy dynamic SEO files to the backend so crawlers hit them at the domain root
    location = /sitemap.xml {
        proxy_pass http://backend:5000/sitemap.xml;
    }
    location = /robots.txt {
        proxy_pass http://backend:5000/robots.txt;
    }

    location ~* \.(?:css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
